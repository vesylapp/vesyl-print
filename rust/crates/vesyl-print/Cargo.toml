[package]
name = "vesyl-print"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "VESYL print node agent (Rust port)"

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
ed25519-dalek = { version = "3.0.0", features = ["pkcs8", "pem"] }
flate2 = "1.1.10"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "webp"] }
libc = "0.2.190"
log = { version = "0.4.34", features = ["std"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.21"
tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
# No default "gzip": urllib never asked for gzip, and a gzip-encoded .tar.gz would
# fail the OTA checksum. "rustls" is the only other default feature.
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "json", "platform-verifier"] }
url = "2.5.8"
uuid = { version = "1.27.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
