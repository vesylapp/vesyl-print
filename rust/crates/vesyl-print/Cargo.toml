[package]
name = "vesyl-print"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "VESYL print node agent (Rust port)"

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
log = "0.4.34"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.21"
tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
ureq = { version = "3.4.2", features = ["json", "platform-verifier"] }
url = "2.5.8"
uuid = { version = "1.27.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
