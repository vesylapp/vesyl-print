# Build signed OTA artifacts and publish to GitHub Releases (CDN).
#
# Trigger: push tag vX.Y.Z (the tag is the release version).
#
# Three jobs, so the signing key and the release write token never share a
# runner with third-party build code (cargo build scripts and proc-macros, the
# ziglang / cargo-zigbuild wheels, toolchain actions):
#   build    contents: read, no secrets, no persisted git credentials. Tests,
#            cross-compiles and packages; uploads the unsigned tarball.
#   sign     contents: read, the only job that gets UPDATE_PRIVATE_KEY. A fresh
#            runner with no pip installs or toolchain actions: SIGN_ONLY=1 runs
#            just sha256sum, python3 (stdlib) and openssl. It hashes the tarball
#            and builds the manifest itself, so the only thing it takes from the
#            build job is the tarball's bytes.
#   publish  contents: write, no signing key. Only `gh release`.
#
# Required repo secret:
#   UPDATE_PRIVATE_KEY  — PEM for Ed25519 private key (pair of keys/update_public.pem)
#
# Third-party actions are pinned to commit SHAs and the zig toolchain to exact
# versions and wheel hashes; bump them deliberately.
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Resolve version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Packaging ${VERSION} from tag ${GITHUB_REF_NAME}"
          # Keep VERSION file in sync with the tag for the tarball
          echo "${VERSION}" > VERSION

      # qemu-user + the aarch64 glibc let build-release.sh run the packaged
      # binary's --version and check it reports the tag's version.
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rsync qemu-user libc6-arm64-cross

      - name: Install Rust (aarch64 target)
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-gnu

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust

      # Own venv: the runner's system Python is externally managed (PEP 668),
      # and $RUNNER_TEMP keeps it out of the rsync'd release tree. Exact
      # versions, binary wheels only, hashes for x86_64 and aarch64 runners.
      - name: Install cargo-zigbuild
        run: |
          python3 -m venv "$RUNNER_TEMP/zigbuild"
          cat > "$RUNNER_TEMP/zigbuild-requirements.txt" <<'EOF'
          ziglang==0.17.0 \
            --hash=sha256:97079827064a7492cce5541ceb438ae8003ce1e54e399676da2d62fb7a5dc08b \
            --hash=sha256:d2804f94f54f7fcf8169f4b212a619ad688a4e2e6592e976f0cf2e58e2cd8af3
          cargo-zigbuild==0.23.4 \
            --hash=sha256:0a149a2a07b9513d422efa9cc23e1add9741f08abe86845fa418eaeb4cca7931 \
            --hash=sha256:9f848addf9ca16e8df52b4a86eb41f7555bb4205aea117ad521f501a307129f5
          EOF
          "$RUNNER_TEMP/zigbuild/bin/pip" install --quiet --require-hashes --only-binary :all: \
            -r "$RUNNER_TEMP/zigbuild-requirements.txt"
          echo "$RUNNER_TEMP/zigbuild/bin" >> "$GITHUB_PATH"

      - name: Test Rust agent
        working-directory: rust
        run: cargo test --locked

      - name: Build release tarball (unsigned, no secrets)
        env:
          BUILD_ONLY: "1"
          OUT_DIR: ${{ github.workspace }}/dist
        run: |
          ./scripts/build-release.sh "${GITHUB_REF_NAME}"
          ls -la dist/

      - name: Upload unsigned tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-tarball
          path: dist/vesyl-print-*-linux-aarch64.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  sign:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The signing script and public key come from this job's own checkout of
      # the tag, never from the build job's artifact.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Download unsigned tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-tarball
          path: dist

      - name: Sign manifest
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.UPDATE_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_CHANNEL: stable
          OUT_DIR: ${{ github.workspace }}/dist
        run: |
          if [[ -z "${UPDATE_PRIVATE_KEY:-}" ]]; then
            echo "ERROR: repo secret UPDATE_PRIVATE_KEY is not set" >&2
            echo "Generate with: openssl genpkey -algorithm Ed25519 -out update_private.pem" >&2
            echo "Public half must match keys/update_public.pem on devices." >&2
            exit 1
          fi
          # Key to a 0600 file that is removed however this step ends; no
          # child process inherits it through the environment.
          umask 077
          key_file="$(mktemp "$RUNNER_TEMP/update_private.XXXXXX")"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$UPDATE_PRIVATE_KEY" > "$key_file"
          unset UPDATE_PRIVATE_KEY
          SIGN_ONLY=1 \
            UPDATE_PRIVATE_KEY_FILE="$key_file" \
            UPDATE_PUBLIC_KEY_FILE=keys/update_public.pem \
            ./scripts/build-release.sh "${GITHUB_REF_NAME}"

      - name: Upload signed manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-manifest
          path: dist/vesyl-print-*.manifest.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [build, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Only for keys/update_public.pem, to re-check the signature.
      - name: Checkout public key
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: keys

      - name: Download unsigned tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-tarball
          path: dist

      - name: Download signed manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-manifest
          path: dist

      - name: Create GitHub Release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          TARBALL="dist/vesyl-print-${VERSION}-linux-aarch64.tar.gz"
          MANIFEST="dist/vesyl-print-${VERSION}.manifest.json"
          test -f "$TARBALL"
          test -f "$MANIFEST"
          # Publish only a manifest that describes exactly this tarball and
          # carries a signature devices will accept.
          python3 - "$TARBALL" "$MANIFEST" "$VERSION" "$RUNNER_TEMP" <<'PY'
          import base64, hashlib, json, sys
          tarball, manifest, version, tmp = sys.argv[1:5]
          with open(manifest, encoding="utf-8") as f:
              m = json.load(f)
          with open(tarball, "rb") as f:
              sha = hashlib.sha256(f.read()).hexdigest()
          problems = []
          if m.get("version") != version:
              problems.append(f"version {m.get('version')!r} != {version!r}")
          if m.get("artifact_sha256") != sha:
              problems.append("artifact_sha256 does not match the tarball")
          if not m.get("signature"):
              problems.append("manifest is not signed")
          if problems:
              sys.exit("refusing to publish: " + "; ".join(problems))
          # Same canonical form as update.ReleaseManifest.canonical_bytes().
          body = {k: v for k, v in m.items() if k != "signature" and v is not None}
          with open(f"{tmp}/manifest.canonical.json", "wb") as f:
              f.write(json.dumps(body, sort_keys=True, separators=(",", ":")).encode())
          with open(f"{tmp}/manifest.sig", "wb") as f:
              f.write(base64.b64decode(m["signature"]))
          PY
          openssl pkeyutl -verify -pubin -inkey keys/update_public.pem -rawin \
            -in "$RUNNER_TEMP/manifest.canonical.json" -sigfile "$RUNNER_TEMP/manifest.sig"
          # --generate-notes uses commits since previous tag
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$TARBALL" "$MANIFEST" --clobber
          else
            gh release create "$TAG" \
              "$TARBALL" \
              "$MANIFEST" \
              --title "vesyl-print ${VERSION}" \
              --generate-notes
          fi
          echo "Published:"
          echo "  https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          echo "  manifest: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/vesyl-print-${VERSION}.manifest.json"
