# Rust agent/CLI: format, lint and test on every change under rust/, and on
# changes to what the tests read: the release scripts they drive
# (scripts/build-release.sh, scripts/apply-update), the files a release tarball
# must carry, the ActionCable fixtures and the release public key. The script
# tests use bash, jq, rsync and openssl from the runner image.
name: Rust

on:
  push:
    branches: [main]
    paths:
      - "rust/**"
      - "scripts/**"
      - "setup.sh"
      - "*.service"
      - "*.py"
      - "assets/**"
      - "base.jpg"
      - "overlays/**"
      - "VERSION"
      - "keys/update_public.pem"
      - "tests/fixtures/**"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "rust/**"
      - "scripts/**"
      - "setup.sh"
      - "*.service"
      - "*.py"
      - "assets/**"
      - "base.jpg"
      - "overlays/**"
      - "VERSION"
      - "keys/update_public.pem"
      - "tests/fixtures/**"
      - ".github/workflows/rust.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked
