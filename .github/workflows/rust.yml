# Rust agent/CLI: format, lint and test on every change under rust/.
name: Rust

on:
  push:
    branches: [main]
    paths: ["rust/**", "VERSION", "keys/update_public.pem", "tests/fixtures/**", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["rust/**", "VERSION", "keys/update_public.pem", "tests/fixtures/**", ".github/workflows/rust.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked
